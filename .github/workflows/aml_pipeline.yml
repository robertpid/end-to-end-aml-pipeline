name: Generador de Datos AML Diario

on:
  schedule:
    # 22:00 UTC equivale a las 5:00 PM (Hora de Lima/Ecuador)
    - cron: '0 13 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón en GitHub

jobs:
  inyectar-datos-azure:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Instalar dependencias y ODBC Driver para Linux
      run: |
        # Agregar las llaves de Microsoft (requiere sudo)
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo tee /etc/apt/trusted.gpg.d/microsoft.asc
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
    
        # Actualizar repositorios e instalar (requiere sudo)
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev
    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r capa_bronze/requirements.txt
        
    - name: Ejecutar Generador AML
      env:
        AZURE_DB_PASSWORD: ${{ secrets.AZURE_DB_PASSWORD }}
      run: python capa_bronze/main.py

    - name: Subir CSVs como Artefactos (Para Databricks)
      uses: actions/upload-artifact@v4
      with:
        name: aml-data-csvs
        path: |
          transacciones_aml_*.csv
          clientes_aml_*.csv

    - name: Setup Databricks CLI
      uses: databricks/setup-cli@main

    - name: Subir CSVs al Lakehouse (Databricks DBFS)
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        for file in transacciones_aml_*.csv; do
            databricks fs cp "$file" "dbfs:/FileStore/aml_data/$file" --overwrite
        done
        for file in clientes_aml_*.csv; do
            databricks fs cp "$file" "dbfs:/FileStore/aml_data/$file" --overwrite
        done
