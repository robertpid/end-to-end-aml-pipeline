name: Generador de Datos AML Diario

on:
  schedule:
    # 22:00 UTC equivale a las 5:00 PM (Hora de Lima/Ecuador)
    - cron: '0 13 * * *'
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón en GitHub

jobs:
  inyectar-datos-azure:
    runs-on: ubuntu-latest
    
    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'


    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r capa_bronze/requirements.txt
        
    - name: Ejecutar Generador AML
      run: python capa_bronze/main.py

    - name: Subir CSVs como Artefactos (Para Databricks)
      uses: actions/upload-artifact@v4
      with:
        name: aml-data-csvs
        path: |
          transacciones_aml_*.csv
          clientes_aml_*.csv

    - name: Subir CSVs al Lakehouse (Databricks Volumes)
      env:
        DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
        DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
      run: |
        for file in transacciones_aml_*.csv; do
          echo "Subiendo $file..."
          curl -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$file" \
            "$DATABRICKS_HOST/api/2.0/fs/files/put?path=%2FVolumes%2Fworkspace%2Faml_proyect%2Fraw_data%2F$file&overwrite=true"
          echo ""
        done
        
        for file in clientes_aml_*.csv; do
          echo "Subiendo $file..."
          curl -X POST \
            -H "Authorization: Bearer $DATABRICKS_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$file" \
            "$DATABRICKS_HOST/api/2.0/fs/files/put?path=%2FVolumes%2Fworkspace%2Faml_proyect%2Fraw_data%2F$file&overwrite=true"
          echo ""
        done
